<!DOCTYPE html>

     <!-- Header -->

        <h1>VINTAUTO</h1>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="">Blog</a>
            <a href="">Galerie</a>
            <a href="contact.html">Contact</a>
        </nav>
     </header>
     <main>
        <h1>Contact</h1>

        <div class="mainContainer">
            <div class="formBox">
                <p>Veuiller remplir le formulaire pour nous contacter.</p>
                <form action="">
                    <input type="text" name="name" id="name" placeholder="Entrer votre nom ...">
                    <input type="email" name="email" id="email" placeholder="Entrer votre email ...">
                    <input type="text" name="subject" id="subject" placeholder="Entrer le sujet de votre message ...">
                    <textarea name="message" id="message" placeholder="Entrer votre message ici ..." ></textarea>
                    <input type="submit" value="Soumettre" id="submitBtn">
                </form>
            </div>
            <div class="imgMap"></div>
        </div>
     </main>

         <!-- Footer de toutes les pages  -->

            <div class="footerContent">
                <p>Créé par Code Décomplexé.</p>
                <p>&copy; VINTAUTO 2026. Tous droits réservés.</p>
            </div>
        </footer>
